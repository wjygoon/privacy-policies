<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隐私政策 · PlayDeck &amp; StarTrail</title>
<meta name="description" content="PlayDeck 与 StarTrail 的隐私政策，中英双语。">
<style>
  :root{
    --bg:#F5F5F8; --card:#FFFFFF; --ink:#1C1C24; --muted:#66667C;
    --line:#E4E4EC; --accent:#3D3D8F; --playdeck:#8A5A2B; --startrail:#4B3FD6;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.7;
  }
  .wrap{max-width:760px; margin:0 auto; padding:48px 20px 64px}
  header{margin-bottom:34px}
  h1{font-size:27px; line-height:1.3; margin:0 0 8px; letter-spacing:-.015em}
  .lead{font-size:15px; color:var(--muted); margin:0}
  .group{margin:0 0 26px}
  .group h2{
    font-size:13px; text-transform:uppercase; letter-spacing:.10em;
    color:var(--muted); margin:0 0 10px; font-weight:600;
  }
  .card{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; margin:0 0 10px;
    transition:border-color .15s ease, transform .15s ease;
  }
  .card:active{transform:scale(.995)}
  .card .row{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .card .name{font-size:16.5px; font-weight:600}
  .card .sub{font-size:13.5px; color:var(--muted); margin-top:3px}
  .langs{display:flex; gap:8px; margin-top:12px}
  .langs a{
    font-size:13px; text-decoration:none; color:var(--accent);
    border:1px solid var(--line); border-radius:999px; padding:3px 12px; background:#FAFAFD;
  }
  .dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:9px; vertical-align:1px}
  .pd .dot{background:var(--playdeck)}
  .st .dot{background:var(--startrail)}
  footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-size:13.5px; color:var(--muted)}
  footer a{color:var(--accent); text-decoration:none; word-break:break-all}
  @media (prefers-color-scheme:dark){
    :root{--bg:#101018; --card:#181822; --ink:#E9E9F1; --muted:#9595AD;
          --line:#2A2A38; --accent:#A9A9FF; --playdeck:#D8A56A; --startrail:#A79BFF;}
    .langs a{background:#1E1E2A}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>隐私政策</h1>
    <p class="lead">PlayDeck 与 StarTrail 的隐私政策。中文与英文内容一致。</p>
  </header>

  <div class="group">
    <h2>PlayDeck · 亲子游戏卡</h2>
    <div class="card pd">
      <div class="row"><span class="name"><span class="dot"></span>PlayDeck 隐私政策</span></div>
      <div class="sub">生效日期 2026-11-09 · 不收集个人信息，不联网，照片只保存在本机</div>
      <div class="langs">
        <a href="playdeck/zh.html">中文</a>
        <a href="playdeck/en.html">English</a>
      </div>
    </div>
  </div>

  <div class="group">
    <h2>StarTrail · 星迹</h2>
    <div class="card st">
      <div class="row"><span class="name"><span class="dot"></span>StarTrail 隐私政策</span></div>
      <div class="sub">生效日期 2026-11-09 · 不收集个人信息，无账号无广告；iCloud 备份需主动开启</div>
      <div class="langs">
        <a href="startrail/zh.html">中文</a>
        <a href="startrail/en.html">English</a>
      </div>
    </div>
  </div>

  <footer>
    联系邮箱：<a href="mailto:wjygoon@163.com">wjygoon@163.com</a><br>
    本页面的历史版本可通过本仓库的提交记录查看。
  </footer>

</div>
</body>
</html>
